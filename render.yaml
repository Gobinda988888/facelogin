services:
  - type: web
    name: facelogin
    runtime: python
    buildCommand: pip install -r requirements.txt && npm --prefix frontend install --include=optional && npm --prefix frontend run build
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: FACE_SIMILARITY_THRESHOLD
        value: "0.35"